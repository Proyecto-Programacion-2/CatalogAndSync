# Perfil `test`: misma instancia de PostgreSQL local, base separada de desarrollo.
# La base la crea docker/init/03-test-database.sh al inicializar el volumen
# (o a mano una vez sobre un volumen existente).
# Credenciales: se heredan de application.yaml / .env; aca solo cambia la URL.
spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/catalogandsync_test}

# Valores placeholder para que los beans del cliente de la catedra se
# construyan sin hacer requests ni abrir conexiones. No se emula a la catedra:
# ningun test invoca los puertos reales.
catedra:
  base-url: http://localhost:1
  jwt: test-token
  connect-timeout: 100ms
  read-timeout: 100ms
integration:
  redis-host: localhost
  redis-port: 1
  redis-username: test
  redis-password: test

# El ciclo periodico se apaga en tests: no debe disparar sync ni tocar Redis.
sync:
  redis:
    connect-timeout: 200ms
    command-timeout: 200ms
  scheduler:
    enabled: false
    fixed-delay-ms: 900000
    initial-delay-ms: 0
